<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DashNXE Servers</title>
  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      background-color: #f4f4f9;
      color: #333;
    }


    .grid-container {
      display: grid;
      grid-template-rows: auto auto 1fr auto; /* Rows for header, nav, middle content, and footer */
      grid-template-columns: 250px 1fr; /* Two columns: 250px sidebar and fluid main content */
      grid-template-areas: 
        "header header"
        "navbar navbar"
        "sidebar main-content"
        "footer footer";
      min-height: 100vh; /* Keeps layout filling at least the full height of the viewport */
    }

    header {
      grid-area: header;
      background-color: #2c3e50;
      color: #fff;
      padding: 20px;
      text-align: center;
    }

    nav {
      grid-area: navbar;
      background-color: #34495e;
      padding: 10px;
    }
    
    nav ul {
      display: flex;
      list-style: none;
      justify-content: center;
      gap: 20px;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }

  
    aside {
      grid-area: sidebar;
      background-color: #ecf0f1;
      padding: 20px;
      border-right: 1px solid #bdc3c7;
    }

    main {
      grid-area: main-content;
      background-color: #fff;
      padding: 30px;
    }

    footer {
      grid-area: footer;
      background-color: #2c3e50;
      color: #fff;
      padding: 15px;
      text-align: center;
    }


    @media (max-width: 768px) {
      .grid-container {
        grid-template-columns: 1fr;
        grid-template-areas: 
          "header"
          "navbar"
          "main-content"
          "sidebar"
          "footer";
      }
      
      aside {
        border-right: none;
        border-top: 1px solid #bdc3c7;
      }
    }
  </style>
</head>
<body>

  <div class="grid-container">
    
 
    <header>
      <h1>DashNXE</h1>
    </header>

    <nav>
      <ul>
        <li><a href="#">Home</a></li>
  
      </ul>
    </nav>


    <aside>
      <h3>Sidebar</h3>
      <p>This area can contain helpful side links, widgets, ads, or secondary information.</p>
    </aside>

    <main>
      <h2>About</h2>
      <p>We here, this is where the MojaveCore's DashNXE Services are managed.</p>
    </main>

    <footer>
      <p>&copy; 2026 MojaveCore, We are not a part of Microsoft Corporation</p>
    </footer>

  </div>

</body>
</html>
